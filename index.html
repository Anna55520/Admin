<!-- ===============================
     PAGE1 USER MANAGEMENT
================================ -->


<section
    id="U9-admin-page-1"
    class="U9-admin-page active"
>


<div id="U9-admin-users">



<div class="U9-admin-users-header">


    <h2>
        User Management
    </h2>


    <div class="U9-admin-header-actions">


        <button
            type="button"
            id="U9-admin-users-refresh"
        >
            Refresh
        </button>



        <button
            type="button"
            id="U9-admin-login-button"
        >
            Login
        </button>


    </div>


</div>





<div
    id="U9-admin-users-message"
    role="status"
    aria-live="polite"
>
</div>





<div class="U9-admin-users-table-wrap">



<table class="U9-admin-users-table">



<thead>


<tr>


<th class="username-column">
    Username
</th>


<th>
    Account
</th>


<th>
    Coins
</th>


<th>
    Balance
</th>


<th>
    Registered
</th>


<th>
    Orders
</th>


<th class="action-column">
    Action
</th>



</tr>


</thead>




<tbody id="U9-admin-users-tbody">


<tr>

<td colspan="7">

Loading user data...

</td>


</tr>


</tbody>



</table>



</div>



</div>
